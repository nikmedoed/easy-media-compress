[package]
name = "easy-media-compress"
version = "1.0.3"
edition = "2024"
default-run = "EasyMediaCompress"

[[bin]]
name = "EasyMediaCompress"
path = "src/main.rs"

[[bin]]
name = "compress"
path = "src/bin/compress.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
dunce = "1"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
